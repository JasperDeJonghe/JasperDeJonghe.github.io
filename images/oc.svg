<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c79a66"/>
      <stop offset="1" stop-color="#a8774a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3b2414" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- table surface seen from the webcam -->
  <rect width="800" height="800" fill="url(#wood)"/>
  <g stroke="#8f6238" stroke-opacity="0.25" stroke-width="2" fill="none">
    <path d="M0 120 C200 110 600 135 800 118"/>
    <path d="M0 260 C250 250 520 275 800 255"/>
    <path d="M0 520 C220 540 560 505 800 528"/>
    <path d="M0 660 C300 650 500 672 800 655"/>
  </g>

  <!-- top bar: target and score -->
  <rect x="0" y="0" width="800" height="150" fill="#1f2733"/>
  <text x="40" y="70" font-family="Consolas, 'Courier New', monospace" font-size="40" fill="#f4efe6">Target: 77</text>
  <text x="40" y="118" font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#9fb0c4">Score: 3</text>
  <circle cx="742" cy="58" r="12" fill="#e0453a"/>
  <text x="722" y="66" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#9fb0c4">REC</text>

  <!-- place values -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#3b2414" text-anchor="middle">
    <text x="78" y="300">128</text><text x="170" y="300">64</text><text x="262" y="300">32</text><text x="354" y="300">16</text>
    <text x="446" y="300">8</text><text x="538" y="300">4</text><text x="630" y="300">2</text><text x="722" y="300">1</text>
  </g>

  <!-- red squares, blue cards = 1 (01001101) -->
  <g filter="url(#shadow)">
    <rect x="40"  y="330" width="76" height="76" rx="4" fill="#d6342c"/>
    <rect x="132" y="330" width="76" height="76" rx="4" fill="#d6342c"/>
    <rect x="224" y="330" width="76" height="76" rx="4" fill="#d6342c"/>
    <rect x="316" y="330" width="76" height="76" rx="4" fill="#d6342c"/>
    <rect x="408" y="330" width="76" height="76" rx="4" fill="#d6342c"/>
    <rect x="500" y="330" width="76" height="76" rx="4" fill="#d6342c"/>
    <rect x="592" y="330" width="76" height="76" rx="4" fill="#d6342c"/>
    <rect x="684" y="330" width="76" height="76" rx="4" fill="#d6342c"/>
  </g>
  <g fill="#2f6fd6" filter="url(#shadow)">
    <rect x="148" y="344" width="44" height="50" rx="3" transform="rotate(-6 170 369)"/>
    <rect x="424" y="344" width="44" height="50" rx="3" transform="rotate(5 446 369)"/>
    <rect x="516" y="344" width="44" height="50" rx="3" transform="rotate(-3 538 369)"/>
    <rect x="700" y="344" width="44" height="50" rx="3" transform="rotate(7 722 369)"/>
  </g>

  <!-- green detection boxes -->
  <g fill="none" stroke="#2bd94a" stroke-width="4">
    <rect x="34" y="324" width="88" height="88"/><rect x="126" y="324" width="88" height="88"/>
    <rect x="218" y="324" width="88" height="88"/><rect x="310" y="324" width="88" height="88"/>
    <rect x="402" y="324" width="88" height="88"/><rect x="494" y="324" width="88" height="88"/>
    <rect x="586" y="324" width="88" height="88"/><rect x="678" y="324" width="88" height="88"/>
  </g>

  <!-- detected bits -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="44" font-weight="700" fill="#1f2733" text-anchor="middle">
    <text x="78" y="470">0</text><text x="170" y="470">1</text><text x="262" y="470">0</text><text x="354" y="470">0</text>
    <text x="446" y="470">1</text><text x="538" y="470">1</text><text x="630" y="470">0</text><text x="722" y="470">1</text>
  </g>

  <!-- bottom readout -->
  <rect x="40" y="600" width="720" height="120" rx="10" fill="#1f2733"/>
  <text x="400" y="676" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="34" fill="#f4efe6">Binary: <tspan fill="#2bd94a">01001101</tspan>  Decimal: <tspan fill="#2bd94a">77</tspan></text>
</svg>

<body>
  <!--
    Sveltia CMS, pinned to an exact version. The integrity hash makes the
    browser refuse the script if the CDN ever serves different code.
    To update: change the version, then recompute the hash with
      curl -sL <url> | openssl dgst -sha384 -binary | openssl base64 -A
  -->
  <script
    src="https://unpkg.com/@sveltia/cms@0.262.1/dist/sveltia-cms.js"
    integrity="sha384-0I8SJ0aZj6wQEpF/FIs2iCJqDlIhSR5xzNQNZFYMRgxcTNPPtFqCLM+PYhVLP+gg"
    crossorigin="anonymous"></script>
</body>

</html>
